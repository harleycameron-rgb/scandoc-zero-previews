<!doctype html><html><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>SCANDOC · Core Expression Lab</title><style>body{background:#081421;color:#e4effa;font:16px system-ui;max-width:850px;margin:auto;padding:24px}a{color:#8de1ff}label{display:block;margin:16px 0}canvas{width:100%;background:#061020;border:1px solid #37516a;border-radius:12px}small{color:#98b4c7}</style><a href="../../index.html">← Root Search</a><h1>Core Expression Lab</h1><p>Six fixed launch identities; adjustable projection only. <strong>Synthetic illustration, not a validated launch.</strong></p><canvas id="v" width="800" height="470"></canvas><label>Scale <input id="scale" type="range" min="50" max="180" value="115"></label><label>Expression phase <input id="phase" type="range" min="0" max="360" value="20"></label><label>Residue display <input id="residue" type="range" min="0" max="90" value="20"></label><p><small>Sentinel position and the six launch names do not change with these sliders.</small></p><script>const c=document.getElementById("v"),ctx=c.getContext("2d");let names=["Tap","Surface","Gain","Habitat","Engine","Business"];function draw(){let scale=+document.getElementById("scale").value,phase=+document.getElementById("phase").value*Math.PI/180,res=+document.getElementById("residue").value;ctx.clearRect(0,0,800,470);ctx.save();ctx.translate(400,232);ctx.strokeStyle="#5dd2f9";ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,scale,0,Math.PI*2);ctx.stroke();for(let j=0;j<7;j++){ctx.beginPath();ctx.ellipse(0,0,scale,scale*(.1+j*.1),phase+j*.2,0,Math.PI*2);ctx.strokeStyle="rgba(85,208,250,.35)";ctx.stroke()}for(let i=0;i<6;i++){let a=i*Math.PI/3+phase,x=Math.cos(a)*(scale+res),y=Math.sin(a)*(scale+res);ctx.strokeStyle="#e9ac5a";ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(x,y);ctx.stroke();ctx.fillStyle="#fff";ctx.fillText(names[i],x+6,y)}ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(0,0,4,0,Math.PI*2);ctx.fill();ctx.restore()}document.querySelectorAll("input").forEach(e=>e.addEventListener("input",draw));draw()</script></html>
