<!doctype html><html><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>SCANDOC · MDL Topology Orrery</title><style>body{background:#071321;color:#e4effa;font:16px system-ui;max-width:860px;margin:auto;padding:24px}a{color:#8de1ff}canvas{width:100%;border:1px solid #37516a;border-radius:12px;background:#07101b}button{padding:10px;margin:5px;background:#19354d;color:#fff;border:1px solid #5b8096;border-radius:8px;cursor:pointer}.active{background:#35617b}small{color:#9ab8c9}</style><a href="../../index.html">← Root Search</a><h1>MDL Topology Orrery</h1><p>Three synthetic overlap trajectories. <strong>Complete overlap is not proof of an MDL attractor.</strong></p><div id="buttons"></div><canvas id="chart" width="800" height="420"></canvas><p id="status"></p><small>Overlap is a fixed synthetic sample sequence, not a live multi-LLM measurement. Forced compression loses explanatory distinctions.</small><script>const data=[{name:"Preserving convergence",overlap:[.4,.5,1,1],retention:[1,1,1,1]},{name:"Forced generic compression",overlap:[.4,1,1,1],retention:[1,0,0,0]},{name:"Persistent residue",overlap:[.25,.25,.25,.25],retention:[1,1,1,1]}];let choice=0;const c=document.getElementById("chart"),ctx=c.getContext("2d");function draw(){document.getElementById("buttons").replaceChildren();data.forEach((x,i)=>{let b=document.createElement("button");b.textContent=x.name;b.className=i===choice?"active":"";b.onclick=()=>{choice=i;draw()};document.getElementById("buttons").append(b)});ctx.clearRect(0,0,800,420);ctx.font="15px system-ui";let d=data[choice];for(let k=0;k<4;k++){let x=100+k*190;ctx.strokeStyle="#28445a";ctx.beginPath();ctx.moveTo(x,20);ctx.lineTo(x,350);ctx.stroke();ctx.fillStyle="#aabed0";ctx.fillText("Iteration "+k,x-40,390)}for(let [vals,col,title]of[[d.overlap,"#57c8f4","Overlap"],[d.retention,"#ecb36e","Explanatory retention"]]){ctx.strokeStyle=col;ctx.lineWidth=3;ctx.beginPath();vals.forEach((v,k)=>{let x=100+k*190,y=340-v*275;k?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke();ctx.fillStyle=col;ctx.fillText(title,title==="Overlap"?80:260,22)}document.getElementById("status").textContent=d.name+": final overlap "+Math.round(d.overlap.at(-1)*100)+"%, final explanatory retention "+Math.round(d.retention.at(-1)*100)+"%."}draw()</script></html>
