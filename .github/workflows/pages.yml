name: Publish approved static previews

# Public publication approved by the repository owner on 2026-10-10.
# Only changes to the published site, checker or deployment workflow redeploy.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'tools/check.cjs'
      - 'tools/build-evidence.cjs'
      - 'tools/benchmark-registry.test.cjs'
      - '.github/workflows/pages.yml'

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile scoped DOI evidence
        run: node tools/build-evidence.cjs
      - name: Check routes, fixtures and receipts
        run: node tools/check.cjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
